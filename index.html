<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾初 LUMI - 預約服務估價</title>
  <style>
    :root {
      --bg-color: #f4efea;
      --card-bg: #fcf9f6;
      --card-border: #e8ded5;
      --primary: #9e7a63;
      --primary-dark: #7a5c48;
      --accent-red: #c85a54;
      --text-dark: #4a4039;
      --text-muted: #8c7e75;
      --badge-bg: #edd8cb;
      --badge-text: #a04938;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 20px 15px 120px;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 24px;
      letter-spacing: 3px;
      color: var(--text-dark);
      font-weight: 500;
    }

    .header p {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(150, 130, 115, 0.05);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 頂部 Mode 切換鈕 */
    .mode-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px 2px;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: #fff;
      color: var(--text-dark);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #f3e9e0;
      border-color: var(--primary);
      color: var(--primary-dark);
      font-weight: bold;
    }

    .badge {
      font-size: 10px;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 1px 5px;
      border-radius: 10px;
    }

    .banner-desc {
      background: #fbf0e8;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--badge-text);
      line-height: 1.5;
      margin-top: 10px;
    }

    /* 款式 Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .style-item {
      border: 1px solid var(--card-border);
      background: #fff;
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .style-item.active {
      border-color: var(--primary);
      background: #f7f0e9;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .style-name {
      font-size: 14px;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .style-price {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .style-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .custom-input-box {
      grid-column: span 2;
      border: 1px solid var(--card-border);
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
    }

    .custom-input-box.active {
      border-color: var(--primary);
      background: #f7f0e9;
    }

    .custom-input {
      width: 80px;
      border: none;
      border-bottom: 1px solid var(--primary);
      background: transparent;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: var(--primary-dark);
      outline: none;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dark);
      margin-top: 12px;
      cursor: pointer;
    }

    .checkbox-row input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    /* 加購與數量微調列 */
    .counter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed var(--card-border);
    }

    .counter-row:last-child {
      border-bottom: none;
    }

    .counter-title {
      font-size: 13px;
    }

    .counter-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .counter-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 15px;
      padding: 2px 8px;
    }

    .counter-btn {
      border: none;
      background: none;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-dark);
      width: 20px;
      height: 24px;
      cursor: pointer;
    }

    .counter-num {
      font-size: 13px;
      font-weight: 600;
      min-width: 16px;
      text-align: center;
    }

    /* 卸甲選擇 */
    .off-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .off-item {
      border: 1px solid var(--card-border);
      background: #fff;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
    }

    .off-item.active {
      border-color: var(--primary);
      background: #f7f0e9;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .off-price {
      font-size: 13px;
      margin-top: 2px;
      color: var(--text-dark);
    }

    .off-unit-note {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* 底部卡片 */
    .footer-card {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: #5c4a3e;
      color: #fff;
      border-radius: 20px 20px 0 0;
      padding: 16px 20px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
    }

    .footer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .total-title {
      font-size: 13px;
      color: #d8c7bc;
    }

    .total-amount {
      font-size: 26px;
      font-weight: bold;
      color: #fff;
    }

    .summary-list {
      font-size: 12px;
      color: #e0d2c8;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 8px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .copy-btn-large {
      width: 100%;
      background: #f2e6dc;
      color: #4a3a2f;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .copy-btn-large:active {
      background: #e0d0c2;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>拾初 LUMI</h1>
    <p>NAIL STUDIO 預約服務估價</p>
  </div>

  <!-- 1. 客類 / 活動選擇 -->
  <div class="card">
    <div class="card-title">✦ 選擇模式 / 活動</div>
    <div class="mode-group">
      <button class="mode-btn active" id="btn-mode-new" onclick="setMode('new')">
        新客原價
      </button>
      <button class="mode-btn" id="btn-mode-promo" onclick="setMode('promo')">
        新客活動 <span class="badge">-200</span>
      </button>
      <button class="mode-btn" id="btn-mode-old" onclick="setMode('old')">
        舊客優惠 <span class="badge">專屬</span>
      </button>
    </div>

    <div class="banner-desc" id="banner-desc">
      🌸 <b>新客價目</b>：標準新客價目表金額計算。
    </div>
  </div>

  <!-- 2. 款式選擇 -->
  <div class="card">
    <div class="card-title">✦ 款式選擇</div>
    <div id="style-container" class="grid-2">
      <!-- 動態載入款式卡片 -->
    </div>

    <label class="checkbox-row" style="margin-top: 15px;">
      <input type="checkbox" id="chk-foot" onchange="calculate()">
      <span>轉為足部凝膠項目 <span style="color: var(--text-muted); font-size: 11px;">足部項目全品項 +$100</span></span>
    </label>
  </div>

  <!-- 3. 加購項目 -->
  <div class="card">
    <div class="card-title">✦ 加購項目</div>
    
    <div class="counter-row">
      <div>
        <div class="counter-title">單指延甲</div>
        <div class="counter-sub">$80 / 指 (不排 10 指延甲)</div>
      </div>
      <div class="counter-ctrl">
        <button class="counter-btn" onclick="addCount('ext', -1)">-</button>
        <span class="counter-num" id="num-ext">0</span>
        <button class="counter-btn" onclick="addCount('ext', 1)">+</button>
      </div>
    </div>

    <div class="counter-row">
      <div>
        <div class="counter-title">底色 (整手)</div>
        <div class="counter-sub">$100 / 次</div>
      </div>
      <div class="counter-ctrl">
        <button class="counter-btn" onclick="addCount('base', -1)">-</button>
        <span class="counter-num" id="num-base">0</span>
        <button class="counter-btn" onclick="addCount('base', 1)">+</button>
      </div>
    </div>

    <div class="counter-row">
      <div>
        <div class="counter-title">補甲 (單指)</div>
        <div class="counter-sub">$50 / 指</div>
      </div>
      <div class="counter-ctrl">
        <button class="counter-btn" onclick="addCount('repair', -1)">-</button>
        <span class="counter-num" id="num-repair">0</span>
        <button class="counter-btn" onclick="addCount('repair', 1)">+</button>
      </div>
    </div>
  </div>

  <!-- 4. 卸甲服務 -->
  <div class="card">
    <div class="card-title">✦ 卸甲服務</div>
    <div class="off-grid">
      <div class="off-item active" id="off-none" onclick="setOffType('none')">
        <div>無需卸甲</div>
        <div class="off-price">$0</div>
      </div>
      <div class="off-item" id="off-self" onclick="setOffType('self')">
        <div>本店續作</div>
        <div class="off-price">$100 <span class="off-unit-note">(全手)</span></div>
        <div class="off-unit-note">單指 $10</div>
      </div>
      <div class="off-item" id="off-other" onclick="setOffType('other')">
        <div>他店續作</div>
        <div class="off-price">$200 <span class="off-unit-note">(全手)</span></div>
        <div class="off-unit-note">單指 $20</div>
      </div>
      <div class="off-item" id="off-only" onclick="setOffType('only')">
        <div>本店不續作</div>
        <div class="off-price">$300 <span class="off-unit-note">(全手)</span></div>
        <div class="off-unit-note">單指 $30</div>
      </div>
    </div>

    <!-- 單指卸甲微調區 -->
    <div id="off-finger-ctrl" class="counter-row" style="margin-top: 12px; display: none;">
      <div>
        <div class="counter-title">卸甲指頭數量</div>
        <div class="counter-sub" id="off-finger-desc">預設全手 10 指</div>
      </div>
      <div class="counter-ctrl">
        <button class="counter-btn" onclick="addCount('offFinger', -1)">-</button>
        <span class="counter-num" id="num-offFinger">10</span>
        <button class="counter-btn" onclick="addCount('offFinger', 1)">+</button>
      </div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="chk-5w" onchange="calculate()">
      <span>符合「五週內回店續作」福利 <span style="color: var(--text-muted); font-size: 11px;">本店卸甲免費 ($100 → $0)</span></span>
    </label>
  </div>

  <!-- 固定底部計算明細卡片 -->
  <div class="footer-card">
    <div class="footer-header">
      <div class="total-title">預估金額總計</div>
      <div class="total-amount" id="total-val">$0</div>
    </div>

    <div class="summary-list" id="summary-text">
      • 【手部】單色：$700<br>
      • 卸甲：無
    </div>

    <button class="copy-btn-large" onclick="copyResult()">一鍵複製預約明細</button>
  </div>

  <script>
    let currentMode = 'new'; // 'new', 'promo', 'old'
    let selectedStyle = 'single';
    let countExt = 0;
    let countBase = 0;
    let countRepair = 0;
    let countOffFinger = 10;
    let selectedOff = 'none';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-new').classList.toggle('active', mode === 'new');
      document.getElementById('btn-mode-promo').classList.toggle('active', mode === 'promo');
      document.getElementById('btn-mode-old').classList.toggle('active', mode === 'old');

      const desc = document.getElementById('banner-desc');
      if (mode === 'new') {
        desc.innerHTML = '🌸 <b>新客價目</b>：標準新客價目表金額計算。';
      } else if (mode === 'promo') {
        desc.innerHTML = '🎉 <b>新客限時活動</b>：新客款式項目可享 <b>折折 $200 元</b> 優惠！';
      } else {
        desc.innerHTML = '💖 <b>舊客專屬優惠價</b>：單色 $490 / 貓眼·碎鑽·漸層·鏡面 $690 / 款式 $990 up。';
      }

      renderStyles();
      calculate();
    }

    function renderStyles() {
      const container = document.getElementById('style-container');
      container.innerHTML = '';

      let styles = [];

      if (currentMode === 'old') {
        styles = [
          { id: 'single', name: '單色', price: 490, sub: '純色 / 可跳一色' },
          { id: 'cat', name: '貓眼', price: 690 },
          { id: 'diamond', name: '碎鑽', price: 690 },
          { id: 'gradient', name: '漸層', price: 690 },
          { id: 'mirror', name: '鏡面', price: 690 },
          { id: 'french', name: '法式', price: 1000 }
        ];
      } else {
        styles = [
          { id: 'single', name: '單色', price: 700, sub: '純色 / 可跳一色' },
          { id: 'cat', name: '貓眼', price: 800 },
          { id: 'diamond', name: '碎鑽', price: 800 },
          { id: 'gradient', name: '漸層', price: 900 },
          { id: 'mirror', name: '鏡面', price: 900 },
          { id: 'french', name: '法式', price: 1000 }
        ];
      }

      styles.forEach(s => {
        let displayPrice = s.price;
        if (currentMode === 'promo') {
          displayPrice = Math.max(0, s.price - 200);
        }

        container.innerHTML += `
          <div class="style-item ${selectedStyle === s.id ? 'active' : ''}" onclick="selectStyle('${s.id}')">
            <div class="style-name">${s.name}</div>
            <div class="style-price">$${displayPrice}</div>
            ${s.sub ? `<div class="style-sub">${s.sub}</div>` : ''}
          </div>
        `;
      });

      let defaultCustom = currentMode === 'old' ? 990 : 1000;
      let customLabel = currentMode === 'old' ? '款式/自帶圖 ($990 up)' : '客帶圖報價 ($1,000 up)';

      container.innerHTML += `
        <div class="custom-input-box ${selectedStyle === 'custom' ? 'active' : ''}" onclick="selectStyle('custom')">
          <div class="style-name">${customLabel}</div>
          <div style="font-size:12px; color:var(--text-muted);">
            點擊輸入美甲師報價金額：$
            <input type="number" id="custom-val" class="custom-input" value="${defaultCustom}" step="50" oninput="calculate()">
          </div>
        </div>
      `;
    }

    function selectStyle(id) {
      selectedStyle = id;
      renderStyles();
      calculate();
    }

    function addCount(type, val) {
      if (type === 'ext') {
        countExt = Math.max(0, countExt + val);
        document.getElementById('num-ext').innerText = countExt;
      } else if (type === 'base') {
        countBase = Math.max(0, countBase + val);
        document.getElementById('num-base').innerText = countBase;
      } else if (type === 'repair') {
        countRepair = Math.max(0, countRepair + val);
        document.getElementById('num-repair').innerText = countRepair;
      } else if (type === 'offFinger') {
        countOffFinger = Math.min(10, Math.max(1, countOffFinger + val));
        document.getElementById('num-offFinger').innerText = countOffFinger;
      }
      calculate();
    }

    function setOffType(type) {
      selectedOff = type;
      ['none', 'self', 'other', 'only'].forEach(t => {
        document.getElementById(`off-${t}`).classList.toggle('active', t === type);
      });

      document.getElementById('off-finger-ctrl').style.display = (type !== 'none') ? 'flex' : 'none';
      calculate();
    }

    function calculate() {
      let total = 0;
      let summary = [];

      // 1. 部位加價
      const isFoot = document.getElementById('chk-foot').checked;
      const locText = isFoot ? '足部' : '手部';
      const locAdd = isFoot ? 100 : 0;

      // 2. 款式計算
      let styleName = '';
      let stylePrice = 0;

      if (selectedStyle === 'custom') {
        styleName = currentMode === 'old' ? '款式/自帶圖' : '客帶圖報價';
        stylePrice = Number(document.getElementById('custom-val').value) || 0;
      } else {
        const names = { single: '單色', cat: '貓眼', diamond: '碎鑽', gradient: '漸層', mirror: '鏡面', french: '法式' };
        styleName = names[selectedStyle];

        if (currentMode === 'old') {
          const oldPrices = { single: 490, cat: 690, diamond: 690, gradient: 690, mirror: 690, french: 1000 };
          stylePrice = oldPrices[selectedStyle];
        } else {
          const newPrices = { single: 700, cat: 800, diamond: 800, gradient: 900, mirror: 900, french: 1000 };
          stylePrice = newPrices[selectedStyle];
        }
      }

      let finalStylePrice = stylePrice;
      if (currentMode === 'promo') {
        finalStylePrice = Math.max(0, stylePrice - 200);
        total += finalStylePrice + locAdd;
        summary.push(`• 【${locText}】${styleName}：$${finalStylePrice + locAdd} <span style="color:#e2a599;">(新客活動折$200)</span>`);
      } else {
        total += finalStylePrice + locAdd;
        summary.push(`• 【${locText}】${styleName}：$${finalStylePrice + locAdd}`);
      }

      // 3. 加購項目
      if (countExt > 0) {
        total += countExt * 80;
        summary.push(`• 單指延甲 x${countExt}：+$${countExt * 80}`);
      }
      if (countBase > 0) {
        total += countBase * 100;
        summary.push(`• 底色 (整手) x${countBase}：+$${countBase * 100}`);
      }
      if (countRepair > 0) {
        total += countRepair * 50;
        summary.push(`• 補甲 x${countRepair}：+$${countRepair * 50}`);
      }

      // 4. 卸甲計算 (全手基準 + 單指微調)
      let offUnitPrice = 0;
      let offName = '';
      if (selectedOff === 'self') { offUnitPrice = 10; offName = '本店續作'; }
      else if (selectedOff === 'other') { offUnitPrice = 20; offName = '他店續作'; }
      else if (selectedOff === 'only') { offUnitPrice = 30; offName = '本店不續作'; }

      if (selectedOff === 'none') {
        summary.push(`• 卸甲：無`);
      } else {
        const is5w = document.getElementById('chk-5w').checked;
        if (selectedOff === 'self' && is5w) {
          summary.push(`• 卸甲-本店續作 (五週福利)：$0`);
        } else {
          let offTotal = offUnitPrice * countOffFinger;
          total += offTotal;
          if (countOffFinger === 10) {
            summary.push(`• 卸甲-${offName} (全手10指)：+$${offTotal}`);
          } else {
            summary.push(`• 卸甲-${offName} (${countOffFinger}指, $${offUnitPrice}/指)：+$${offTotal}`);
          }
        }
      }

      document.getElementById('total-val').innerText = '$' + total;
      document.getElementById('summary-text').innerHTML = summary.join('<br>');
    }

    function copyResult() {
      const total = document.getElementById('total-val').innerText;
      const rawSummary = document.getElementById('summary-text').innerText;
      
      const copyContent = `🌸 拾初 LUMI 預約估價明細 🌸\n--------------------\n${rawSummary}\n--------------------\n預估金額總計：${total}`;

      navigator.clipboard.writeText(copyContent).then(() => {
        alert('預約明細已成功複製！可以貼給客人囉！');
      }).catch(() => {
        alert('已複製明細內容，請手動貼上。');
      });
    }

    // 初始化
    setMode('new');
  </script>
</body>
</html>
